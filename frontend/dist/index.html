<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EvidenceGuard RAG — Hallucination-Resistant Retrieval</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            midnight: {
              950: '#050507',
              900: '#090a0f',
              850: '#0f1117',
              800: '#141721',
              700: '#1e2230',
              600: '#2d3345'
            },
            lime: {
              300: '#bef264',
              400: '#a3e635',
              500: '#84cc16',
              600: '#65a30d'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #050507;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      overflow-x: hidden;
    }
    .obsidian-card {
      background: linear-gradient(145deg, rgba(15, 17, 23, 0.85) 0%, rgba(9, 10, 15, 0.95) 100%);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.7);
    }
    .obsidian-card:hover {
      border-color: rgba(163, 230, 53, 0.25);
    }
    .glow-lime {
      box-shadow: 0 0 25px -5px rgba(163, 230, 53, 0.35);
    }
    .badge-lime {
      background: rgba(163, 230, 53, 0.12);
      color: #bef264;
      border: 1px solid rgba(163, 230, 53, 0.35);
    }
    .badge-amber {
      background: rgba(245, 158, 11, 0.12);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.35);
    }
    .badge-purple {
      background: rgba(192, 132, 252, 0.12);
      color: #e9d5ff;
      border: 1px solid rgba(192, 132, 252, 0.35);
    }
    .badge-red {
      background: rgba(248, 113, 113, 0.12);
      color: #fca5a5;
      border: 1px solid rgba(248, 113, 113, 0.35);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #090a0f;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #2d3345;
      border-radius: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #84cc16;
    }
  </style>
</head>
<body class="min-h-screen selection:bg-lime-400 selection:text-midnight-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [activeTab, setActiveTab] = useState("playground");
      const [query, setQuery] = useState("");
      const [mode, setMode] = useState("evidenceguard");
      const [loading, setLoading] = useState(false);
      const [response, setResponse] = useState(null);
      const [health, setHealth] = useState(null);
      const [documents, setDocuments] = useState([]);
      const [traceOpen, setTraceOpen] = useState(false);
      const [experiments, setExperiments] = useState([]);
      const [selectedExp, setSelectedExp] = useState("ablations");
      const [expContent, setExpContent] = useState("");

      useEffect(() => {
        fetchHealth();
        fetchDocuments();
        fetchExperiments();
        loadExpReport("ablations");
      }, []);

      const fetchHealth = () => {
        fetch("/health")
          .then(res => res.json())
          .then(data => setHealth(data))
          .catch(err => console.log("Health check standby", err));
      };

      const fetchDocuments = () => {
        fetch("/documents")
          .then(res => res.json())
          .then(data => setDocuments(data.documents || []))
          .catch(err => console.log(err));
      };

      const fetchExperiments = () => {
        fetch("/experiments")
          .then(res => res.json())
          .then(data => setExperiments(data.experiments || []))
          .catch(err => console.log(err));
      };

      const handleQuery = async (e) => {
        e.preventDefault();
        if (!query.trim()) return;
        setLoading(true);
        setResponse(null);
        try {
          const res = await fetch("/query", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query, mode, top_k: 5 })
          });
          const data = await res.json();
          setResponse(data);
        } catch (err) {
          alert("Query error: " + err);
        } finally {
          setLoading(false);
        }
      };

      const handleUpload = async (e) => {
        e.preventDefault();
        const fileInput = document.getElementById("file-upload");
        if (!fileInput.files[0]) return;
        const formData = new FormData();
        formData.append("file", fileInput.files[0]);
        formData.append("strategy", "recursive");
        
        try {
          const res = await fetch("/documents/upload", {
            method: "POST",
            body: formData
          });
          const data = await res.json();
          alert("Document indexed: " + data.title + " (" + data.chunks_indexed + " chunks)");
          fetchDocuments();
          fetchHealth();
        } catch (err) {
          alert("Upload error: " + err);
        }
      };

      const loadExpReport = async (expId) => {
        setSelectedExp(expId);
        try {
          const res = await fetch(`/experiments/${expId}`);
          const data = await res.json();
          setExpContent(data.content);
        } catch (err) {
          setExpContent("Report loading failed.");
        }
      };

      const renderDecisionBadge = (decision) => {
        switch (decision) {
          case "SUFFICIENT":
            return (
              <span className="badge-lime px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-lime-400 animate-pulse"></span> Sufficient Evidence
              </span>
            );
          case "PARTIALLY_SUFFICIENT":
            return (
              <span className="badge-amber px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider flex items-center gap-1.5">
                <i className="fa-solid fa-triangle-exclamation text-amber-400"></i> Partial Evidence
              </span>
            );
          case "CONFLICTING":
            return (
              <span className="badge-purple px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider flex items-center gap-1.5">
                <i className="fa-solid fa-bolt text-purple-300"></i> Conflicting Sources
              </span>
            );
          case "IRRELEVANT":
            return (
              <span className="badge-red px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider flex items-center gap-1.5">
                <i className="fa-solid fa-filter text-red-300"></i> Irrelevant Context
              </span>
            );
          default:
            return (
              <span className="badge-red px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider flex items-center gap-1.5">
                <i className="fa-solid fa-shield-virus text-red-400"></i> Insufficient (Abstain)
              </span>
            );
        }
      };

      return (
        <div className="flex flex-col min-h-screen bg-midnight-950 text-white">
          {/* Top Navbar */}
          <header className="sticky top-0 z-50 px-6 py-4 bg-midnight-900/90 backdrop-blur-xl border-b border-white/10 flex items-center justify-between">
            <div className="flex items-center space-x-3.5">
              <div className="w-10 h-10 rounded-xl bg-lime-400 text-midnight-950 flex items-center justify-center font-extrabold text-xl shadow-lg shadow-lime-400/20">
                <i className="fa-solid fa-shield-halved"></i>
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-lg font-bold tracking-tight text-white font-sans">EvidenceGuard</h1>
                  <span className="px-2 py-0.5 rounded-full text-[10px] font-bold tracking-wider bg-lime-400/10 text-lime-400 border border-lime-400/30">
                    RAG FIREWALL
                  </span>
                </div>
                <p className="text-xs text-neutral-400 font-medium">Hallucination-Resistant Retrieval Architecture</p>
              </div>
            </div>

            {/* Navigation Tabs */}
            <nav className="flex space-x-1.5 bg-midnight-850 p-1.5 rounded-xl border border-white/10">
              <button 
                onClick={() => setActiveTab("playground")}
                className={`px-4 py-2 rounded-lg text-xs font-semibold transition-all duration-200 flex items-center gap-2 ${activeTab === 'playground' ? 'bg-white text-midnight-950 shadow-md font-bold' : 'text-neutral-400 hover:text-white'}`}>
                <i className="fa-solid fa-bolt-lightning text-lime-500"></i> Playground
              </button>
              <button 
                onClick={() => setActiveTab("documents")}
                className={`px-4 py-2 rounded-lg text-xs font-semibold transition-all duration-200 flex items-center gap-2 ${activeTab === 'documents' ? 'bg-white text-midnight-950 shadow-md font-bold' : 'text-neutral-400 hover:text-white'}`}>
                <i className="fa-solid fa-folder-closed text-neutral-400"></i> Corpus ({documents.length})
              </button>
              <button 
                onClick={() => setActiveTab("experiments")}
                className={`px-4 py-2 rounded-lg text-xs font-semibold transition-all duration-200 flex items-center gap-2 ${activeTab === 'experiments' ? 'bg-white text-midnight-950 shadow-md font-bold' : 'text-neutral-400 hover:text-white'}`}>
                <i className="fa-solid fa-chart-simple text-neutral-400"></i> Benchmarks & Evals
              </button>
            </nav>

            {/* Status Indicator */}
            <div className="hidden md:flex items-center space-x-3 text-xs bg-midnight-850 px-3.5 py-1.5 rounded-xl border border-white/10">
              <span className="flex items-center gap-1.5 font-medium text-white">
                <span className="w-2 h-2 rounded-full bg-lime-400 animate-pulse"></span>
                {health?.device || "RTX 4080 SUPER"}
              </span>
              <span className="text-neutral-600">|</span>
              <span className="text-neutral-400 font-mono text-[11px]">VRAM: <strong className="text-white">{health?.vram_allocated_mb || 450} MB</strong></span>
            </div>
          </header>

          {/* Main Workspace */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-6 md:p-8 space-y-8">
            {activeTab === "playground" && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                {/* Left Controls */}
                <div className="lg:col-span-5 space-y-6">
                  <div className="obsidian-card rounded-2xl p-6">
                    <div className="flex items-center justify-between mb-5">
                      <h2 className="text-sm font-bold text-white uppercase tracking-wider flex items-center gap-2">
                        <i className="fa-solid fa-sliders text-lime-400"></i> Query Engine
                      </h2>
                      <span className="text-xs text-lime-400 font-mono">Top-k: 5</span>
                    </div>

                    {/* Mode Selector */}
                    <div className="mb-5">
                      <label className="block text-[11px] font-bold text-neutral-400 uppercase tracking-wider mb-2">Architecture Mode</label>
                      <div className="grid grid-cols-2 gap-2 bg-midnight-900 p-1.5 rounded-xl border border-white/5">
                        <button
                          type="button"
                          onClick={() => setMode("evidenceguard")}
                          className={`py-2 px-3 rounded-lg text-xs font-bold transition flex items-center justify-center gap-2 ${mode === 'evidenceguard' ? 'bg-lime-400 text-midnight-950 glow-lime' : 'text-neutral-400 hover:text-white'}`}>
                          <i className="fa-solid fa-shield-halved"></i> EvidenceGuard
                        </button>
                        <button
                          type="button"
                          onClick={() => setMode("baseline")}
                          className={`py-2 px-3 rounded-lg text-xs font-bold transition flex items-center justify-center gap-2 ${mode === 'baseline' ? 'bg-neutral-800 text-white border border-white/20' : 'text-neutral-400 hover:text-white'}`}>
                          <i className="fa-solid fa-robot"></i> Baseline RAG
                        </button>
                      </div>
                    </div>

                    <form onSubmit={handleQuery} className="space-y-4">
                      <div>
                        <label className="block text-[11px] font-bold text-neutral-400 uppercase tracking-wider mb-2">Prompt / Inquiry</label>
                        <textarea
                          rows="4"
                          value={query}
                          onChange={(e) => setQuery(e.target.value)}
                          placeholder="Ask a technical, factual, or adversarial question..."
                          className="w-full bg-midnight-900 border border-white/10 rounded-xl p-3.5 text-sm text-white focus:outline-none focus:border-lime-400 transition resize-none font-sans placeholder-neutral-600"></textarea>
                      </div>

                      {/* Benchmark Presets */}
                      <div>
                        <span className="block text-[10px] font-bold uppercase tracking-wider text-neutral-500 mb-2">Benchmark Test Presets:</span>
                        <div className="grid grid-cols-2 gap-2">
                          <button
                            type="button"
                            onClick={() => setQuery("What is the primary mechanism of action of metformin in treating type 2 diabetes?")}
                            className="text-left text-[11px] p-2 rounded-lg bg-midnight-900 hover:bg-midnight-800 border border-white/5 text-neutral-300 hover:text-white transition">
                            <span className="text-lime-400 font-bold block">Cat A (Answerable)</span> Metformin mechanism
                          </button>
                          <button
                            type="button"
                            onClick={() => setQuery("What was the exact battery capacity in watt-hours of Nikola Tesla's original 1888 electric automobile prototype?")}
                            className="text-left text-[11px] p-2 rounded-lg bg-midnight-900 hover:bg-midnight-800 border border-white/5 text-neutral-300 hover:text-white transition">
                            <span className="text-red-400 font-bold block">Cat B (Unanswerable)</span> Tesla 1888 prototype
                          </button>
                          <button
                            type="button"
                            onClick={() => setQuery("What was the total global production volume of Boeing 737 aircraft in the calendar year 2023?")}
                            className="text-left text-[11px] p-2 rounded-lg bg-midnight-900 hover:bg-midnight-800 border border-white/5 text-neutral-300 hover:text-white transition">
                            <span className="text-purple-400 font-bold block">Cat E (Contradiction)</span> Boeing 2023 deliveries
                          </button>
                          <button
                            type="button"
                            onClick={() => setQuery("What are the two active ingredients in Paxlovid, and what is its standard clinical course duration?")}
                            className="text-left text-[11px] p-2 rounded-lg bg-midnight-900 hover:bg-midnight-800 border border-white/5 text-neutral-300 hover:text-white transition">
                            <span className="text-amber-400 font-bold block">Cat D (Partial Info)</span> Paxlovid composite
                          </button>
                        </div>
                      </div>

                      <button
                        type="submit"
                        disabled={loading}
                        className="w-full py-3.5 bg-lime-400 hover:bg-lime-300 text-midnight-950 font-extrabold rounded-xl text-sm transition-all duration-200 glow-lime flex items-center justify-center gap-2 cursor-pointer">
                        {loading ? <i className="fa-solid fa-spinner animate-spin"></i> : <i className="fa-solid fa-play"></i>}
                        {loading ? "Evaluating Context Sufficiency..." : "Run RAG Inference"}
                      </button>
                    </form>
                  </div>
                </div>

                {/* Right Response & Auditing */}
                <div className="lg:col-span-7 space-y-6">
                  {response ? (
                    <div className="space-y-6">
                      {/* Main Response Box */}
                      <div className="obsidian-card rounded-2xl p-6 relative">
                        <div className="flex flex-wrap items-center justify-between gap-3 mb-5 pb-4 border-b border-white/10">
                          <div className="flex items-center gap-3">
                            {renderDecisionBadge(response.decision)}
                            <span className="text-xs font-mono text-neutral-400">
                              Confidence: <strong className="text-white">{(response.confidence * 100).toFixed(1)}%</strong>
                            </span>
                          </div>
                          <span className="text-xs text-lime-400 font-mono flex items-center gap-1.5">
                            <i className="fa-regular fa-clock"></i> {response.latency_ms.toFixed(1)} ms
                          </span>
                        </div>

                        {/* Generated Answer */}
                        <div className="text-base text-neutral-100 font-normal leading-relaxed mb-4">
                          {response.answer}
                        </div>

                        {/* Special Callout: Abstention */}
                        {response.abstention_reason && (
                          <div className="p-4 rounded-xl bg-red-950/20 border border-red-500/30 text-xs text-red-200 flex items-start gap-3 my-4">
                            <i className="fa-solid fa-shield-halved text-base text-red-400 mt-0.5"></i>
                            <div>
                              <strong className="block text-white font-bold mb-1">Principled Abstention Triggered:</strong>
                              {response.abstention_reason}
                            </div>
                          </div>
                        )}

                        {/* Special Callout: Conflicts */}
                        {response.conflicts?.has_conflict && (
                          <div className="p-4 rounded-xl bg-purple-950/20 border border-purple-500/30 text-xs text-purple-200 flex items-start gap-3 my-4">
                            <i className="fa-solid fa-bolt text-base text-purple-400 mt-0.5"></i>
                            <div>
                              <strong className="block text-white font-bold mb-1">Discrepancy / Contradiction Flagged:</strong>
                              <p className="mb-2">{response.conflicts.explanation}</p>
                              <ul className="list-disc list-inside space-y-1 text-purple-300">
                                {response.conflicts.conflicting_claims.map((claim, idx) => (
                                  <li key={idx}>{claim}</li>
                                ))}
                              </ul>
                            </div>
                          </div>
                        )}

                        {/* Citations & Trace Toggle Footer */}
                        <div className="pt-4 border-t border-white/10 flex items-center justify-between">
                          <div className="flex items-center gap-2">
                            <i className="fa-solid fa-check text-lime-400 text-xs"></i>
                            <span className="text-xs font-semibold text-neutral-300">
                              {response.citations.length} Grounded Citations
                            </span>
                          </div>
                          <button
                            type="button"
                            onClick={() => setTraceOpen(!traceOpen)}
                            className="text-xs font-bold text-lime-400 hover:text-lime-300 flex items-center gap-1.5 transition">
                            <i className="fa-solid fa-diagram-project"></i>
                            {traceOpen ? "Hide Trace" : "Inspect LangGraph Trace"}
                            <i className={`fa-solid fa-chevron-down text-[10px] transition-transform ${traceOpen ? 'rotate-180' : ''}`}></i>
                          </button>
                        </div>

                        {/* Expandable Trace Drawer */}
                        {traceOpen && (
                          <div className="mt-4 p-4 rounded-xl bg-midnight-950 border border-white/10 space-y-2 font-mono text-xs">
                            <div className="text-[11px] font-bold uppercase tracking-wider text-neutral-400 mb-2 font-sans">
                              LangGraph Execution Steps:
                            </div>
                            {response.execution_trace.map((step, idx) => (
                              <div key={idx} className="flex items-center justify-between p-2 rounded bg-midnight-900 border border-white/5">
                                <span className="text-lime-400 font-bold">Step {idx+1}: {step.node}</span>
                                <span className="text-neutral-400 text-[11px] truncate max-w-xs">{JSON.stringify(step)}</span>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>

                      {/* Retrieved Passages */}
                      <div className="obsidian-card rounded-2xl p-6">
                        <div className="flex items-center justify-between mb-4">
                          <h3 className="text-xs font-bold text-white uppercase tracking-wider flex items-center gap-2">
                            <i className="fa-solid fa-book-bookmark text-lime-400"></i> Retrieved Passages ({response.retrieved_passages.length})
                          </h3>
                          <span className="text-[11px] font-mono text-neutral-500">Hybrid RRF + Cross-Encoder</span>
                        </div>
                        <div className="space-y-3">
                          {response.retrieved_passages.map((p, idx) => (
                            <div key={idx} className="p-4 rounded-xl bg-midnight-900/80 border border-white/5 space-y-2 text-xs">
                              <div className="flex items-center justify-between">
                                <span className="font-bold text-white">{p.title} <span className="text-neutral-500 font-mono text-[11px]">[{p.id}]</span></span>
                                <div className="space-x-3 text-[11px] font-mono">
                                  {p.rerank_score !== null && <span className="text-lime-400 font-bold">Rerank: {p.rerank_score.toFixed(3)}</span>}
                                  {p.dense_score !== null && <span className="text-neutral-400">Dense: {p.dense_score.toFixed(3)}</span>}
                                </div>
                              </div>
                              <p className="text-neutral-300 leading-relaxed font-sans">{p.text}</p>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  ) : (
                    <div className="obsidian-card rounded-2xl p-16 text-center text-neutral-500 flex flex-col items-center justify-center space-y-4">
                      <div className="w-16 h-16 rounded-2xl bg-midnight-900 border border-white/10 flex items-center justify-center text-2xl text-lime-400">
                        <i className="fa-solid fa-shield-halved"></i>
                      </div>
                      <div>
                        <h3 className="text-base font-bold text-white mb-1">Awaiting Query Input</h3>
                        <p className="text-xs text-neutral-400 max-w-sm">Type a question or pick one of the benchmark test presets to verify hallucination resistance.</p>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* Documents Tab */}
            {activeTab === "documents" && (
              <div className="space-y-6">
                <div className="obsidian-card rounded-2xl p-6">
                  <h2 className="text-sm font-bold text-white uppercase tracking-wider mb-4 flex items-center gap-2">
                    <i className="fa-solid fa-file-arrow-up text-lime-400"></i> Index Custom Document
                  </h2>
                  <form onSubmit={handleUpload} className="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
                    <div className="md:col-span-8">
                      <label className="block text-[11px] font-bold text-neutral-400 uppercase tracking-wider mb-2">Supported: PDF, DOCX, TXT, CSV, Markdown</label>
                      <input
                        type="file"
                        id="file-upload"
                        className="w-full bg-midnight-900 border border-white/10 rounded-xl p-2.5 text-xs text-neutral-300 file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-lime-400 file:text-midnight-950 hover:file:bg-lime-300 cursor-pointer" />
                    </div>
                    <div className="md:col-span-4">
                      <button
                        type="submit"
                        className="w-full py-2.5 bg-lime-400 hover:bg-lime-300 text-midnight-950 font-extrabold rounded-xl text-xs transition glow-lime flex items-center justify-center gap-2">
                        <i className="fa-solid fa-upload"></i> Upload & Chunk
                      </button>
                    </div>
                  </form>
                </div>

                <div className="obsidian-card rounded-2xl p-6">
                  <h3 className="text-sm font-bold text-white uppercase tracking-wider mb-4">Knowledge Base Documents</h3>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-midnight-900 text-neutral-400 uppercase tracking-wider border-b border-white/10">
                        <tr>
                          <th className="p-3.5">Title</th>
                          <th className="p-3.5">Format</th>
                          <th className="p-3.5">Chunks</th>
                          <th className="p-3.5">Source Date</th>
                          <th className="p-3.5 text-right">Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-white/5">
                        {documents.length > 0 ? (
                          documents.map((doc, idx) => (
                            <tr key={idx} className="hover:bg-midnight-900/50">
                              <td className="p-3.5 font-bold text-white">{doc.title}</td>
                              <td className="p-3.5 uppercase font-mono text-lime-400">{doc.file_type}</td>
                              <td className="p-3.5 font-mono">{doc.chunks_count}</td>
                              <td className="p-3.5 text-neutral-400">{doc.date || "N/A"}</td>
                              <td className="p-3.5 text-right">
                                <span className="px-2 py-0.5 rounded bg-lime-400/10 text-lime-400 text-[10px] font-bold border border-lime-400/20">Active</span>
                              </td>
                            </tr>
                          ))
                        ) : (
                          <tr>
                            <td colSpan="5" className="p-6 text-center text-neutral-500">
                              Evaluation benchmark corpus (140 passages) is active in-memory.
                            </td>
                          </tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* Benchmarks & Reports Tab */}
            {activeTab === "experiments" && (
              <div className="grid grid-cols-1 md:grid-cols-12 gap-8">
                <div className="md:col-span-4 space-y-3">
                  <div className="obsidian-card rounded-2xl p-5">
                    <h3 className="text-xs font-bold text-white uppercase tracking-wider mb-4 flex items-center gap-2">
                      <i className="fa-solid fa-flask-vial text-lime-400"></i> Measured Results
                    </h3>
                    <div className="space-y-2">
                      {experiments.map((exp, idx) => (
                        <button
                          key={idx}
                          type="button"
                          onClick={() => loadExpReport(exp.id)}
                          className={`w-full text-left p-3.5 rounded-xl text-xs font-bold transition flex items-center justify-between border ${selectedExp === exp.id ? 'bg-lime-400 text-midnight-950 border-lime-400 glow-lime' : 'bg-midnight-900 text-neutral-300 hover:text-white border-white/5'}`}>
                          <span>{exp.title}</span>
                          <i className="fa-solid fa-chevron-right text-[10px]"></i>
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="md:col-span-8">
                  <div className="obsidian-card rounded-2xl p-6 min-h-[500px]">
                    <div className="prose prose-invert max-w-none text-xs font-mono leading-relaxed whitespace-pre-wrap custom-scrollbar overflow-y-auto max-h-[600px]">
                      {expContent}
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="border-t border-white/10 py-5 px-6 text-center text-xs text-neutral-500">
            EvidenceGuard RAG Architecture &bull; Midnight &bull; Pure White &bull; Lime Green &bull; MIT License
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
