version: "3.8"

services:
  evidenceguard-api:
    build: .
    container_name: evidenceguard_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEFAULT_LLM_PROVIDER=mock
      - ENABLE_MLFLOW=true
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./experiments:/app/experiments
    depends_on:
      - mlflow

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.0
    container_name: evidenceguard_mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    command: mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow-artifacts --host 0.0.0.0 --port 5000
    volumes:
      - ./experiments/mlflow_data:/mlflow-artifacts
